<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks (data in your Google Drive)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  li { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  li.done span { text-decoration: line-through; opacity: .5; }
  #status { font-size: .85em; opacity: .7; margin-top: 12px; }
</style>
</head>
<body>

<h1>Tasks</h1>
<button id="login">Google でログイン</button>
<div id="app" hidden>
  <form id="add"><input id="text" placeholder="新しいタスク" autocomplete="off"><button>追加</button></form>
  <ul id="list"></ul>
  <div id="status"></div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ===== 開発者が用意するのはこれだけ（Google Cloud Console → OAuth クライアント ID → Web アプリ） =====
const CLIENT_ID = 'YOUR_CLIENT_ID.apps.googleusercontent.com';

// ===== ストレージ層：利用者の Drive appDataFolder に JSON 1 ファイルを置く =====
const Storage = (() => {
  const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
  const FILE = 'tasks.json';
  let token = null, fileId = null, tokenClient = null;

  function auth(prompt = '') {
    return new Promise((resolve, reject) => {
      tokenClient ??= google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID, scope: SCOPE,
        callback: r => r.error ? reject(r) : (token = r.access_token, resolve()),
      });
      tokenClient.requestAccessToken({ prompt });
    });
  }

  async function api(url, opt = {}) {
    opt.headers = { ...opt.headers, Authorization: `Bearer ${token}` };
    let res = await fetch(url, opt);
    if (res.status === 401) { await auth(); opt.headers.Authorization = `Bearer ${token}`; res = await fetch(url, opt); }
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    return res;
  }

  async function findFile() {
    if (fileId) return fileId;
    const q = `spaces=appDataFolder&fields=files(id)&q=${encodeURIComponent(`name='${FILE}'`)}`;
    const { files } = await (await api(`https://www.googleapis.com/drive/v3/files?${q}`)).json();
    return fileId = files[0]?.id ?? null;
  }

  return {
    signIn: () => auth('consent'),

    async load() {
      const id = await findFile();
      if (!id) return null;
      return (await api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json();
    },

    async save(data) {
      const body = JSON.stringify(data);
      const id = await findFile();
      if (id) {
        await api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,
          { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
      } else {
        const meta = JSON.stringify({ name: FILE, parents: ['appDataFolder'] });
        const boundary = 'b' + Date.now();
        const multipart =
          `--${boundary}\r\nContent-Type: application/json\r\n\r\n${meta}\r\n` +
          `--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
        const res = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
          { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${boundary}` }, body: multipart });
        fileId = (await res.json()).id;
      }
    },
  };
})();

// ===== アプリ層：ここは手元のツールのロジックをそのまま持ってくる =====
let tasks = [];
const $ = s => document.querySelector(s);

function render() {
  $('#list').innerHTML = tasks.map((t, i) =>
    `<li class="${t.done ? 'done' : ''}">
       <input type="checkbox" data-i="${i}" ${t.done ? 'checked' : ''}>
       <span>${t.text.replace(/</g, '&lt;')}</span>
       <button data-del="${i}">×</button></li>`).join('');
}

let saveTimer;
function persist() {
  clearTimeout(saveTimer);
  $('#status').textContent = '保存中…';
  saveTimer = setTimeout(async () => {
    try { await Storage.save(tasks); $('#status').textContent = 'Drive に保存済み'; }
    catch (e) { $('#status').textContent = '保存失敗: ' + e.message; }
  }, 500);
}

$('#login').onclick = async () => {
  await Storage.signIn();
  tasks = (await Storage.load()) ?? [];
  $('#login').hidden = true; $('#app').hidden = false;
  render();
};
$('#add').onsubmit = e => {
  e.preventDefault();
  const text = $('#text').value.trim(); if (!text) return;
  tasks.push({ text, done: false }); $('#text').value = '';
  render(); persist();
};
$('#list').onclick = e => {
  if (e.target.dataset.i) { tasks[e.target.dataset.i].done = e.target.checked; render(); persist(); }
  if (e.target.dataset.del) { tasks.splice(e.target.dataset.del, 1); render(); persist(); }
};
</script>
</body>
</html>
